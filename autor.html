<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autor — Archivo del Carnaval del Campo de Gibraltar</title>
  <meta name="description" content="Ficha de autor del Archivo del Carnaval del Campo de Gibraltar." />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* ---- AUTOR HERO ---- */
    .autor-hero {
      padding: 80px 0 64px;
      background: linear-gradient(160deg, var(--white) 0%, #eef3ff 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .autor-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 80% at 80% 50%, rgba(57,134,255,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .autor-hero__breadcrumb {
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 40px;
    }
    .autor-hero__breadcrumb a:hover { color: var(--blue); }
    .autor-hero__inner {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 48px;
      align-items: start;
    }
    @media (max-width: 700px) {
      .autor-hero__inner { grid-template-columns: 1fr; text-align: center; }
      .autor-hero__avatar { margin: 0 auto; }
      .autor-hero__stats { justify-content: center; }
      .autor-hero__meta { justify-content: center; }
    }
    .autor-hero__avatar {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--surface2), var(--surface3));
      border: 2px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .autor-hero__avatar img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .autor-hero__avatar svg { color: var(--text-muted); }
    .autor-hero__badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
      background: rgba(57,134,255,0.1);
      border: 1px solid rgba(57,134,255,0.2);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .autor-hero__name {
      font-family: var(--font-display);
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--text-primary);
      margin-bottom: 16px;
    }
    .autor-hero__bio {
      font-family: var(--font-body);
      font-size: 18px;
      color: var(--text-secondary);
      line-height: 1.8;
      font-style: italic;
      max-width: 640px;
      margin-bottom: 24px;
    }
    .autor-hero__bio--empty {
      color: var(--text-muted);
      font-style: normal;
      font-size: 15px;
    }
    .autor-hero__meta {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .autor-hero__meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-secondary);
    }
    .autor-hero__stats {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
    }
    .autor-hero__stat {
      display: flex;
      flex-direction: column;
    }
    .autor-hero__stat-val {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
    }
    .autor-hero__stat-label {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ---- TIMELINE SECTION ---- */
    .timeline-section {
      padding: 72px 0;
    }
    .timeline-section__title {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray3);
      margin-bottom: 8px;
    }
    .timeline-section__heading {
      font-family: var(--font-display);
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 700;
      margin-bottom: 48px;
    }

    .timeline {
      position: relative;
      padding-left: 32px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: linear-gradient(to bottom, var(--blue), rgba(57,134,255,0.1));
    }

    /* Group by decade */
    .timeline-decade {
      margin-bottom: 48px;
    }
    .timeline-decade__label {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 16px;
      margin-left: -32px;
      padding-left: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .timeline-decade__label::before {
      content: '';
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--blue);
      flex-shrink: 0;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 16px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -29px; top: 18px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      transition: border-color var(--transition), background var(--transition);
    }
    .timeline-item:hover::before {
      border-color: var(--blue);
      background: rgba(57,134,255,0.15);
    }

    .timeline-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
      text-decoration: none;
      color: inherit;
    }
    .timeline-card:hover {
      border-color: rgba(57,134,255,0.3);
      transform: translateX(4px);
      box-shadow: var(--shadow-md);
    }
    @media (max-width: 600px) {
      .timeline-card {
        grid-template-columns: auto 1fr;
        padding: 14px 16px;
        gap: 12px;
      }
      .timeline-card__year { font-size: 16px; }
      .timeline-card__name { font-size: 15px; }
      .timeline-card__arrow { display: none; }
      .autor-hero__inner { gap: 24px; }
      .autor-hero__avatar { width: 100px; height: 100px; }
      .autor-hero__stat-val { font-size: 24px; }
    }
    .timeline-card__year {
      font-family: var(--font-sans);
      font-size: 22px;
      font-weight: 700;
      color: var(--blue);
      line-height: 1;
    }
    .timeline-card__body { min-width: 0; }
    .timeline-card__name {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: normal;
      overflow-wrap: break-word;
      word-break: break-word;
      margin-bottom: 4px;
    }
    .timeline-card__meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .timeline-card__municipio {
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--text-muted);
    }
    .timeline-card__modalidad {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--surface2);
      color: var(--text-secondary);
    }
    .timeline-card__arrow {
      color: var(--text-muted);
      flex-shrink: 0;
      transition: color var(--transition), transform var(--transition);
    }
    .timeline-card:hover .timeline-card__arrow {
      color: var(--blue);
      transform: translateX(3px);
    }

    /* ---- EMPTY / NOT FOUND ---- */
    .autor-not-found {
      text-align: center;
      padding: 120px 24px;
    }
    .autor-not-found__icon { color: var(--gray2); margin: 0 auto 24px; }
    .autor-not-found__title {
      font-family: var(--font-display);
      font-size: 32px;
      margin-bottom: 12px;
    }
    .autor-not-found__text {
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .autor-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 120px 0;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 14px;
    }
    .autor-loading__dots { display: flex; gap: 6px; }
    .autor-loading__dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--blue);
      animation: dotPulse 1.2s ease-in-out infinite;
    }
    .autor-loading__dots span:nth-child(2) { animation-delay: 0.2s; }
    .autor-loading__dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div id="navbar-placeholder"></div>

<main id="main-content">

  <!-- LOADING -->
  <div id="loading-state">
    <div class="container autor-loading">
      <div class="autor-loading__dots"><span></span><span></span><span></span></div>
      <span>Cargando autor…</span>
    </div>
  </div>

  <!-- NOT FOUND -->
  <div id="not-found-state" hidden>
    <div class="container autor-not-found">
      <div class="autor-not-found__icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <h1 class="autor-not-found__title">Autor no encontrado</h1>
      <p class="autor-not-found__text">No existe ningún autor con este identificador en el archivo.</p>
      <a href="autores.html" class="btn btn-outline">Volver a Autores</a>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="autor-content" hidden>

    <!-- HERO -->
    <section class="autor-hero">
      <div class="container">
        <nav class="autor-hero__breadcrumb" aria-label="Migas de pan">
          <a href="index.html">Inicio</a>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          <a href="autores.html">Autores</a>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          <span id="breadcrumb-name">—</span>
        </nav>
        <div class="autor-hero__inner">
          <div class="autor-hero__avatar" id="autor-avatar">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="autor-hero__info">
            <div class="autor-hero__badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              Autor/a
            </div>
            <h1 class="autor-hero__name" id="autor-name">—</h1>
            <p class="autor-hero__bio" id="autor-bio"></p>
            <div class="autor-hero__meta" id="autor-meta"></div>
            <div class="autor-hero__stats" id="autor-stats"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- TIMELINE -->
    <section class="timeline-section" id="timeline-section">
      <div class="container">
        <p class="timeline-section__title">Trayectoria</p>
        <h2 class="timeline-section__heading">Agrupaciones</h2>
        <div id="timeline-container"></div>
        <div id="timeline-empty" hidden style="color:var(--gray3);font-family:var(--font-sans);font-size:14px;padding:24px 0">
          Este autor no tiene agrupaciones registradas en el archivo.
        </div>
      </div>
    </section>

    <!-- PALMARÉS -->
    <section class="timeline-section" id="palmares-section" hidden style="background:var(--surface2);border-top:1px solid var(--border)">
      <div class="container">
        <p class="timeline-section__title">Reconocimientos</p>
        <h2 class="timeline-section__heading">Palmarés</h2>
        <div id="palmares-container"></div>
      </div>
    </section>

  </div>

</main>

<div id="footer-placeholder"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  'use strict';

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function show(id) { const el = document.getElementById(id); if (el) el.hidden = false; }
  function hide(id) { const el = document.getElementById(id); if (el) el.hidden = true; }

  function svgChevron() {
    return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>`;
  }
  function svgPin() {
    return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
  }

  function renderAvatar(autor) {
    const el = document.getElementById('autor-avatar');
    if (!el) return;
    const foto = autor.foto || autor.foto_url || '';
    if (foto) {
      el.innerHTML = `<img src="${esc(foto)}" alt="${esc(autor.nombre)}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.innerHTML='<svg width=56 height=56 viewBox=0 0 24 24 fill=none stroke=currentColor stroke-width=1.2><path d=M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2/><circle cx=12 cy=7 r=4/></svg>'">`;
    }
  }

  function renderMeta(autor) {
    const el = document.getElementById('autor-meta');
    if (!el) return;
    const parts = [];
    const municipio = autor.municipio || '';
    if (municipio) {
      parts.push(`<span class="autor-hero__meta-item">${svgPin()} ${esc(municipio)}</span>`);
    }
    el.innerHTML = parts.join('');
  }

  function renderStats(agrupaciones) {
    const el = document.getElementById('autor-stats');
    if (!el || !agrupaciones.length) return;
    const anys = agrupaciones.map(ag => ag.anyoNum).filter(Boolean);
    const minAny = anys.length ? Math.min(...anys) : null;
    const maxAny = anys.length ? Math.max(...anys) : null;
    const modalidades = [...new Set(agrupaciones.map(ag => ag.modalidad).filter(Boolean))];

    el.innerHTML = `
      <div class="autor-hero__stat">
        <span class="autor-hero__stat-val">${agrupaciones.length}</span>
        <span class="autor-hero__stat-label">agrupaci${agrupaciones.length !== 1 ? 'ones' : 'ón'}</span>
      </div>
      ${minAny ? `<div class="autor-hero__stat">
        <span class="autor-hero__stat-val">${minAny}</span>
        <span class="autor-hero__stat-label">primera agrupación</span>
      </div>` : ''}
      ${minAny && maxAny && minAny !== maxAny ? `<div class="autor-hero__stat">
        <span class="autor-hero__stat-val">${maxAny - minAny + 1}</span>
        <span class="autor-hero__stat-label">años de trayectoria</span>
      </div>` : ''}
      ${modalidades.length ? `<div class="autor-hero__stat">
        <span class="autor-hero__stat-val">${modalidades.length}</span>
        <span class="autor-hero__stat-label">modalidad${modalidades.length !== 1 ? 'es' : ''}</span>
      </div>` : ''}
    `;
  }

  function renderTimeline(agrupaciones) {
    const container = document.getElementById('timeline-container');
    const empty = document.getElementById('timeline-empty');
    if (!container) return;

    if (!agrupaciones.length) {
      hide('timeline-container');
      show('timeline-empty');
      return;
    }

    // Sort by year descending
    const sorted = [...agrupaciones].sort((a, b) => (b.anyoNum || 0) - (a.anyoNum || 0));

    // Group by decade
    const decades = new Map();
    sorted.forEach(ag => {
      const decade = ag.decada || (ag.anyoNum ? Math.floor(ag.anyoNum / 10) * 10 : 0);
      if (!decades.has(decade)) decades.set(decade, []);
      decades.get(decade).push(ag);
    });

    // Decade labels
    const decadeLabel = d => d ? `Años ${d}` : 'Fecha desconocida';

    let html = '<div class="timeline">';
    decades.forEach((ags, decade) => {
      html += `<div class="timeline-decade">
        <div class="timeline-decade__label">${esc(decadeLabel(decade))}</div>`;
      ags.forEach(ag => {
        const modalidad = ag.modalidad
          ? `<span class="timeline-card__modalidad">${esc(ag.modalidad)}</span>`
          : '';
        const municipio = ag.municipio
          ? `<span class="timeline-card__municipio">${esc(ag.municipio)}</span>`
          : '';
        html += `
          <div class="timeline-item">
            <a class="timeline-card" href="agrupacion.html?id=${esc(ag.id)}">
              <div class="timeline-card__year">${esc(ag.anyo || '—')}</div>
              <div class="timeline-card__body">
                <div class="timeline-card__name">${esc(ag.nombre)}</div>
                <div class="timeline-card__meta">${municipio}${modalidad}</div>
              </div>
              <div class="timeline-card__arrow">${svgChevron()}</div>
            </a>
          </div>`;
      });
      html += '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
  }

  function renderPalmares(agrupaciones) {
    const conPremios = agrupaciones.filter(ag => ag.premios && ag.premios.length > 0)
      .sort((a, b) => (b.anyoNum || 0) - (a.anyoNum || 0));
    if (!conPremios.length) return;
    const sec = document.getElementById('palmares-section');
    const container = document.getElementById('palmares-container');
    if (!sec || !container) return;
    const medalEmoji = ['🥇', '🥈', '🥉', '🏅'];
    const medalColor = ['#FFD700', '#C0C0C0', '#CD7F32', '#9ca3af'];
    const html = conPremios.map(ag => {
      const premioItems = ag.premios.map((p, i) => `
        <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:10px;margin-bottom:8px">
          <span style="font-size:20px">${medalEmoji[i] || '🏅'}</span>
          <div>
            <div style="font-family:var(--font-sans);font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:${medalColor[i]||'#9ca3af'};margin-bottom:2px">${i===0?'1.er Premio':i===1?'2.º Premio':i===2?'3.er Premio':'Premio'}</div>
            <div style="font-family:var(--font-body);font-size:15px;color:var(--text-secondary)">${esc(p)}</div>
          </div>
        </div>`).join('');
      return `
        <div style="margin-bottom:28px">
          <a href="agrupacion.html?id=${esc(ag.id)}" style="display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text-primary);text-decoration:none;margin-bottom:12px;transition:color .2s" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color='var(--text-primary)'">
            ${esc(ag.nombre)}
            <span style="font-family:var(--font-sans);font-size:13px;font-weight:400;color:var(--text-muted)">${ag.anyo ? ag.anyo : ''}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </a>
          ${premioItems}
        </div>`;
    }).join('');
    container.innerHTML = html;
    sec.hidden = false;
  }

  async function init() {
    if (typeof initPage === 'function') initPage({ activePage: 'autores' });

    const slug = new URLSearchParams(location.search).get('slug') || '';
    if (!slug) {
      hide('loading-state');
      show('not-found-state');
      return;
    }

    // Load autor from CSV index + autores_extra from Supabase in parallel
    let [autor, extra] = await Promise.all([
      DataAPI.getAutorBySlug(slug).catch(() => null),
      DataAPI.getAutorExtra(slug).catch(() => null)
    ]);

    hide('loading-state');

    if (!autor) {
      show('not-found-state');
      document.title = 'Autor no encontrado — Archivo del Carnaval del Campo de Gibraltar';
      return;
    }

    // Merge Supabase extra data
    if (extra) {
      if (extra.foto_url) autor.foto = extra.foto_url;
      if (extra.bio)      autor.bio  = extra.bio;
      if (extra.municipio && !autor.municipio) autor.municipio = extra.municipio;
      if (extra.nombre)   autor.nombre = extra.nombre; // use canonical name from Supabase
    }

    const nombre = autor.nombre || slug;
    document.title = `${nombre} — Archivo del Carnaval del Campo de Gibraltar`;

    // Breadcrumb
    const bc = document.getElementById('breadcrumb-name');
    if (bc) bc.textContent = nombre;

    // Avatar
    renderAvatar(autor);

    // Name
    const nameEl = document.getElementById('autor-name');
    if (nameEl) nameEl.textContent = nombre;

    // Bio
    const bioEl = document.getElementById('autor-bio');
    if (bioEl) {
      if (autor.bio) {
        bioEl.textContent = autor.bio;
        bioEl.classList.remove('autor-hero__bio--empty');
      } else {
        bioEl.textContent = 'Autor del Carnaval del Campo de Gibraltar.';
        bioEl.classList.add('autor-hero__bio--empty');
      }
    }

    // Meta (municipio)
    renderMeta(autor);

    // Load agrupaciones
    const agrupacionIds = autor.agrupaciones || [];
    const agrupaciones = (await Promise.all(
      agrupacionIds.map(id => DataAPI.getAgrupacionById(id).catch(() => null))
    )).filter(Boolean);

    // Stats
    renderStats(agrupaciones);

    // Timeline
    renderTimeline(agrupaciones);

    // Palmarés: collect agrupaciones with premios
    renderPalmares(agrupaciones);

    show('autor-content');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
}());
</script>

</body>
</html>
