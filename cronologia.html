<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronología — Archivo del Carnaval del Campo de Gibraltar</title>
  <meta name="description" content="Cronología del Carnaval del Campo de Gibraltar. Todas las agrupaciones ordenadas por año y década desde los años 70.">
  <meta property="og:title" content="Cronología — Archivo del Carnaval del Campo de Gibraltar">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .timeline-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .decade-btn {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: var(--gray4);
      cursor: pointer;
      transition: var(--transition);
    }
    .decade-btn:hover { border-color: var(--blue); color: var(--blue); }
    .decade-btn.active { background: var(--blue); border-color: var(--blue); color: var(--white); }
    .decade-block { margin-bottom: 96px; scroll-margin-top: 100px; }
    .decade-header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 48px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .decade-number {
      font-family: var(--font-display);
      font-size: clamp(56px, 8vw, 96px);
      font-weight: 900;
      line-height: 1;
      color: var(--blue);
    }
    .decade-stats {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .decade-stat-big {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
    }
    .decade-stat-small {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--gray3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .year-group { margin-bottom: 48px; }
    .year-label {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray3);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .year-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }
    .year-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }
    .year-card {
      background: var(--dark2);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .year-card:hover {
      border-color: var(--blue);
      transform: translateX(4px);
    }
    .year-card-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: rgba(57,134,255,0.15);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .year-card-icon svg { width: 20px; height: 20px; color: var(--blue); }
    .year-card-content { flex: 1; min-width: 0; }
    .year-card-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .year-card-meta {
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--gray3);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .year-card-arrow { color: var(--blue); flex-shrink: 0; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>

<section class="page-hero">
  <div class="page-hero-bg"></div>
  <div class="container page-hero-content">
    <nav class="page-breadcrumb">
      <a href="index.html">Inicio</a>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
      <span>Cronologia</span>
    </nav>
    <h1 class="page-title">Cronologia del <span class="text-gradient">Carnaval</span></h1>
    <p class="page-subtitle">La historia completa del Carnaval del Campo de Gibraltar, ordenada por decadas y anos.</p>
  </div>
</section>

<section class="section section-dark">
  <div class="container">
    <div class="timeline-controls" id="decade-controls">
      <div class="spinner" style="width:20px;height:20px"></div>
    </div>
    <div id="timeline-content">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <span class="loading-text">Cargando cronologia...</span>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const db = await DataAPI.getAll();
  const ags = db.agrupaciones.filter(a => a.anyo);
  const decadas = [...new Set(ags.map(a => a.decada))].filter(Boolean).sort();

  // Controls
  const controls = document.getElementById('decade-controls');
  controls.innerHTML = '<button class="decade-btn active" data-dec="all">Todas</button>' +
    decadas.map(d => `<button class="decade-btn" data-dec="${d}">${d}s</button>`).join('');

  controls.querySelectorAll('.decade-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      controls.querySelectorAll('.decade-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const dec = btn.dataset.dec;
      if (dec === 'all') {
        document.querySelectorAll('.decade-block').forEach(b => b.style.display = '');
      } else {
        document.querySelectorAll('.decade-block').forEach(b => {
          b.style.display = b.dataset.decade === dec ? '' : 'none';
        });
        const block = document.querySelector(`.decade-block[data-decade="${dec}"]`);
        if (block) block.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  // Build content
  const content = document.getElementById('timeline-content');
  if (!decadas.length) {
    content.innerHTML = '<div class="empty-state"><p class="empty-state-title">Cronologia en construccion</p><p class="empty-state-desc">Los datos se estan procesando.</p></div>';
    return;
  }

  content.innerHTML = decadas.map(dec => {
    const decAgs = ags.filter(a => a.decada === dec).sort((a, b) => a.anyoNum - b.anyoNum);
    const years = [...new Set(decAgs.map(a => a.anyo))].sort();

    const yearGroups = years.map(yr => {
      const yrAgs = decAgs.filter(a => a.anyo === yr);
      const cards = yrAgs.map(ag => `
        <div class="year-card" onclick="location.href='agrupacion.html?id=${ag.id}'">
          <div class="year-card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z"/></svg>
          </div>
          <div class="year-card-content">
            <div class="year-card-name">${ag.nombre}</div>
            <div class="year-card-meta">
              <span>${ag.municipio || ''}</span>
              ${ag.modalidad ? `<span class="tag ${modalidadColor(ag.modalidad)}" style="padding:2px 8px;font-size:10px">${ag.modalidad}</span>` : ''}
              ${ag.premios.length ? `<span style="color:var(--yellow)">★ ${ag.premios.length} premio${ag.premios.length > 1 ? 's' : ''}</span>` : ''}
            </div>
          </div>
          <svg class="year-card-arrow" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
        </div>
      `).join('');
      return `<div class="year-group">
        <div class="year-label">${yr} <span style="color:var(--gray3);font-weight:400">${yrAgs.length} agrupacion${yrAgs.length !== 1 ? 'es' : ''}</span></div>
        <div class="year-grid">${cards}</div>
      </div>`;
    }).join('');

    return `
      <div class="decade-block" id="d${dec}" data-decade="${dec}">
        <div class="decade-header">
          <div class="decade-number">${dec}s</div>
          <div class="decade-stats">
            <div class="decade-stat-big">${decAgs.length} agrupaciones</div>
            <div class="decade-stat-small">${years.length} anos · ${[...new Set(decAgs.map(a => a.municipio))].length} municipios</div>
          </div>
        </div>
        ${yearGroups}
      </div>
    `;
  }).join('');
});
</script>
</body>
</html>
